ancestor: null
releases:
  0.1.0:
    changes:
      minor_changes:
      - Every module supports check mode and diff mode, including the cascade.
      - '``host_info`` filters by ``remark`` or ``address`` and returns every match,
        which is how to act on all the hosts serving one domain.'
      - '``host`` accepts a ``nodes`` option to declare that binding, by node name.'
      - '``host`` addresses panels by ``remark`` or, with ``identify_by: address``,
        by domain, so a list of domains needs no invented remarks; a host created
        that way takes its address as its remark, and ``remark`` becomes an ordinary
        field that can rename it. An identifier matching several hosts fails the task
        instead of picking one.'
      - '``node`` can carry the hosts bound to it along when a node is taken out of
        service, through ``linked_hosts`` (``ignore``/``enable``/``disable``/``delete``).
        Hosts bound to no node are never affected.'
      - '``user``, ``node`` and ``host`` share one ``state`` property: ``present``
        (exists, enabled/disabled left alone), ``enabled``, ``disabled`` and ``absent``.'
      release_summary: Initial release. Developed and tested against the Remnawave
        API specification v3.4.3, including a live panel run.
    modules:
    - description: Call an arbitrary Remnawave API endpoint
      name: api
      namespace: ''
    - description: Manage Remnawave config profiles
      name: config_profile
      namespace: ''
    - description: Retrieve Remnawave config profiles
      name: config_profile_info
      namespace: ''
    - description: Manage Remnawave external squads
      name: external_squad
      namespace: ''
    - description: Retrieve Remnawave external squads
      name: external_squad_info
      namespace: ''
    - description: Manage Remnawave subscription hosts
      name: host
      namespace: ''
    - description: Retrieve Remnawave hosts
      name: host_info
      namespace: ''
    - description: Manage Remnawave internal squads
      name: internal_squad
      namespace: ''
    - description: Retrieve Remnawave internal squads
      name: internal_squad_info
      namespace: ''
    - description: Manage Remnawave nodes
      name: node
      namespace: ''
    - description: Retrieve Remnawave nodes
      name: node_info
      namespace: ''
    - description: Manage Remnawave subscription settings
      name: subscription_settings
      namespace: ''
    - description: Retrieve Remnawave system information
      name: system_info
      namespace: ''
    - description: Manage Remnawave panel users
      name: user
      namespace: ''
    - description: Retrieve Remnawave users
      name: user_info
      namespace: ''
    objects:
      role:
      - description: Apply a complete desired state to a panel
        name: remnawave
        namespace: null
    release_date: '2026-09-02'
  0.1.1:
    changes:
      minor_changes:
      - docs - add contributing instructions
      - docs - add version bump instructions
      - python - migrate from pip to uv everywhere
      - tests - add tests
    fragments:
    - 1.yml
    release_date: '2026-09-02'
  1.0.2:
    changes:
      minor_changes:
      - remnawave role - add ``remnawave_snippets``, applied before ``remnawave_config_profiles``
        because profiles embed snippets.
      - snippet - manage Remnawave snippets declaratively, addressed by name, with
        the supplied content treated as authoritative.
      - snippet - run the panel's sync action against the config profiles embedding
        a snippet whenever the snippet changed, controlled by the new ``sync`` option
        (``on_change`` by default, or ``never``/``always``).
      - snippet_info - retrieve one snippet by name or list all of them.
    fragments:
    - add-snippet-modules.yml
    release_date: '2026-09-06'
  1.1.0:
    changes:
      minor_changes:
      - host - add ``exclude_from_subscription_types``, authoritative when set, to
        leave a host out of some subscription formats.
      - host - add ``internal_squads`` (``mode`` of ``exclude``/``allow_only`` plus
        a squad list by name or UUID) to govern which internal squads see a host.
      - host - add ``override_sni_from_address`` and ``keep_sni_blank``, the SNI overrides
        a chain entry needs when the address it publishes is not the domain the exit
        node terminates TLS for.
      - host - add ``vless_route_id``, the route id a config profile's routing rules
        match on to send a host's traffic through a particular outbound or balancer.
        It takes an integer between 0 and 65535, and an empty string clears it.
    fragments:
    - host-vless-routing.yml
    release_date: '2026-09-06'
