ancestor: null
releases:
  0.1.0:
    changes:
      minor_changes:
      - Every module supports check mode and diff mode, including the cascade.
      - '``host_info`` filters by ``remark`` or ``address`` and returns every match,
        which is how to act on all the hosts serving one domain.'
      - '``host`` accepts a ``nodes`` option to declare that binding, by node name.'
      - '``host`` addresses panels by ``remark`` or, with ``identify_by: address``,
        by domain, so a list of domains needs no invented remarks; a host created
        that way takes its address as its remark, and ``remark`` becomes an ordinary
        field that can rename it. An identifier matching several hosts fails the task
        instead of picking one.'
      - '``node`` can carry the hosts bound to it along when a node is taken out of
        service, through ``linked_hosts`` (``ignore``/``enable``/``disable``/``delete``).
        Hosts bound to no node are never affected.'
      - '``user``, ``node`` and ``host`` share one ``state`` property: ``present``
        (exists, enabled/disabled left alone), ``enabled``, ``disabled`` and ``absent``.'
      release_summary: Initial release. Developed and tested against the Remnawave
        API specification v3.4.3, including a live panel run.
    modules:
    - description: Call an arbitrary Remnawave API endpoint
      name: api
      namespace: ''
    - description: Manage Remnawave config profiles
      name: config_profile
      namespace: ''
    - description: Retrieve Remnawave config profiles
      name: config_profile_info
      namespace: ''
    - description: Manage Remnawave external squads
      name: external_squad
      namespace: ''
    - description: Retrieve Remnawave external squads
      name: external_squad_info
      namespace: ''
    - description: Manage Remnawave subscription hosts
      name: host
      namespace: ''
    - description: Retrieve Remnawave hosts
      name: host_info
      namespace: ''
    - description: Manage Remnawave internal squads
      name: internal_squad
      namespace: ''
    - description: Retrieve Remnawave internal squads
      name: internal_squad_info
      namespace: ''
    - description: Manage Remnawave nodes
      name: node
      namespace: ''
    - description: Retrieve Remnawave nodes
      name: node_info
      namespace: ''
    - description: Manage Remnawave subscription settings
      name: subscription_settings
      namespace: ''
    - description: Retrieve Remnawave system information
      name: system_info
      namespace: ''
    - description: Manage Remnawave panel users
      name: user
      namespace: ''
    - description: Retrieve Remnawave users
      name: user_info
      namespace: ''
    objects:
      role:
      - description: Apply a complete desired state to a panel
        name: remnawave
        namespace: null
    release_date: '2026-09-02'
  0.1.1:
    changes:
      minor_changes:
      - docs - add contributing instructions
      - docs - add version bump instructions
      - python - migrate from pip to uv everywhere
      - tests - add tests
    fragments:
    - 1.yml
    release_date: '2026-09-02'
  1.0.2:
    changes:
      minor_changes:
      - remnawave role - add ``remnawave_snippets``, applied before ``remnawave_config_profiles``
        because profiles embed snippets.
      - snippet - manage Remnawave snippets declaratively, addressed by name, with
        the supplied content treated as authoritative.
      - snippet - run the panel's sync action against the config profiles embedding
        a snippet whenever the snippet changed, controlled by the new ``sync`` option
        (``on_change`` by default, or ``never``/``always``).
      - snippet_info - retrieve one snippet by name or list all of them.
    fragments:
    - add-snippet-modules.yml
    release_date: '2026-09-06'
  1.1.0:
    changes:
      minor_changes:
      - host - add ``exclude_from_subscription_types``, authoritative when set, to
        leave a host out of some subscription formats.
      - host - add ``internal_squads`` (``mode`` of ``exclude``/``allow_only`` plus
        a squad list by name or UUID) to govern which internal squads see a host.
      - host - add ``override_sni_from_address`` and ``keep_sni_blank``, the SNI overrides
        a chain entry needs when the address it publishes is not the domain the exit
        node terminates TLS for.
      - host - add ``vless_route_id``, the route id a config profile's routing rules
        match on to send a host's traffic through a particular outbound or balancer.
        It takes an integer between 0 and 65535, and an empty string clears it.
    fragments:
    - host-vless-routing.yml
    release_date: '2026-09-06'
  1.2.0:
    changes:
      minor_changes:
      - config_profile - add ``tags``, authoritative when set, applied through the
        panel's dedicated tags endpoint.
      - external_squad - add ``tags``, authoritative when set, so existing squads
        can be retagged as well as created tagged.
      - internal_squad - add ``tags``, authoritative when set, applied through the
        panel's dedicated tags endpoint.
      - node, host - validate ``tags`` against the panel's format (at most 10 tags
        of up to 36 uppercase letters, digits, underscores and colons) before sending
        anything, failing with a message that names the offending tag.
      - remnawave role - add ``remnawave_gather`` to read entities back after the
        desired state is applied, published as the ``remnawave_gathered`` fact.
      - remnawave role - pass ``tags`` through for ``remnawave_config_profiles``,
        ``remnawave_internal_squads`` and ``remnawave_external_squads``.
      - system_info - add ``timezone``, sent as the bandwidth statistics' ``tz`` query
        parameter.
      - user_info - add lookups by ``id`` and ``short_uuid``.
      - user_info - add the stream endpoint's filters ``status``, ``traffic_limit_strategy``,
        ``telegram_id``, ``email``, ``tag`` and ``external_squad`` (by name or UUID),
        with ``cursor`` pagination returning ``next_cursor`` and ``has_more``.
      - user_info - add the table endpoint's ``filters``, ``filter_modes``, ``global_filter_mode``
        and ``sorting``, with ``start``/``size`` pagination returning ``total``.
    fragments:
    - entity-tags.yml
    - read-entities.yml
    release_date: '2026-09-14'
  1.2.1:
    changes:
      bugfixes:
      - remnawave role - pass ``vless_route_id``, ``override_sni_from_address``, ``keep_sni_blank``,
        ``exclude_from_subscription_types`` and ``internal_squads`` of ``remnawave_hosts``
        entries through to the panel; the host stage used to drop them silently.
      minor_changes:
      - all modules - fetch the listings used to resolve names (config profiles, squads,
        nodes, hosts, snippets) at most once per module run, until the module writes
        something.
      - host - share its planning and applying code with the new ``hosts`` module;
        behaviour is unchanged.
      - remnawave role - apply ``remnawave_hosts`` in one ``kenyawest.remnawave.hosts``
        task instead of a loop of ``kenyawest.remnawave.host``, so the stage reads
        the panel once however many hosts it declares. A host may now appear only
        once in the list.
      release_summary: Speeds up managing many hosts, which took seconds per host
        as a loop of the ``host`` module.
    fragments:
    - hosts-batch.yml
    modules:
    - description: Manage many Remnawave subscription hosts in one task
      name: hosts
      namespace: ''
    release_date: '2026-09-14'
  1.3.0:
    changes:
      bugfixes:
      - all modules - report the panel's own error message and error code for failed
        requests; they were replaced by the bare HTTP status text, such as ``HTTP
        Error 500 Internal Server Error``.
      - config_profile - ignore the ``settings.clients`` list the panel adds to every
        inbound when it stores an updated config; a profile whose config had been
        updated once used to report a change on every later run.
      minor_changes:
      - all modules - return ``api_trace``, every request made with its status and
        duration, and ``api_seconds``, their total, when run with ``-vvv``.
      - config_profile - add ``inbound``, which identifies the profile by the tag
        (or UUID) of one of its inbounds instead of by name. ``name`` then renames
        the profile, and a ``config`` that no longer declares the identifying inbound
        is refused.
      - config_profile_info - add ``inbound`` to look a profile up by an inbound tag
        or UUID, and return ``inbounds``, the inbounds of the returned profiles with
        their UUIDs and the UUID and name of their profile.
      - host, hosts - make ``config_profile`` optional; the profile is the one holding
        ``inbound``, since inbound tags are unique across profiles.
      - host, hosts - read the listings planning needs (hosts, nodes, config profiles,
        internal squads) concurrently up front instead of one after another.
      - hosts - delete hosts in one bulk request, update hosts given the very same
        change together in one bulk update (falling back to one request per host on
        panels without it), and run these update requests up to the new ``parallelism``
        option (default ``4``) at a time. A rejected write now stops the task before
        any later write of the batch, and ``results`` lists the entries that were
        carried out.
      - hosts - put the listed hosts in list order in the panel, with one reorder
        request after the other writes and only when they are out of order, under
        the new ``ordered`` option (default ``true``). Hosts not listed keep their
        places, and a host that only moves is reported as an ``update``. This lets
        creations run up to ``parallelism`` at a time too; with ``ordered=false``
        they still go one by one in list order and the panel's order is left alone.
      - internal_squad - accept plain inbound tags in ``inbounds``, and dicts with
        ``tag`` but no ``profile``.
      - node - make ``config_profile`` optional; the profile is the one holding ``inbounds``,
        which must all belong to it.
      - node - share its planning and applying code with the new ``nodes`` module,
        and read the listings it needs concurrently up front; behaviour is unchanged.
      - nodes - new module managing many nodes in one task, with the options of ``node``
        per entry. It reads each listing once, enables and disables nodes in one request
        each, updates nodes given the very same change of country code, consumption
        multiplier, tags, note or config profile in one bulk request, disables nodes
        created disabled in one request, and runs the other writes up to ``parallelism``
        (default ``4``) at a time. Like ``hosts``, it puts the listed nodes in list
        order under ``ordered`` (default ``true``).
      - remnawave role - apply ``remnawave_nodes`` in one ``kenyawest.remnawave.nodes``
        task instead of a loop of ``kenyawest.remnawave.node``. A node may now appear
        only once in the list, and the nodes are arranged in the panel in list order.
      - remnawave role - pass ``inbound`` through for ``remnawave_config_profiles``,
        accept ``inbound`` when gathering config profiles, and publish their inbounds
        as ``remnawave_gathered.inbounds``.
    fragments:
    - config-profile-inbound-tags.yml
    - hosts-bulk-parallel-writes.yml
    - nodes-batch-module.yml
    modules:
    - description: Manage many Remnawave nodes in one task.
      name: nodes
      namespace: ''
    release_date: '2026-10-17'
