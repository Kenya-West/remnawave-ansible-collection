---
ancestor:
releases:
  0.1.0:
    changes:
      minor_changes:
        - Every module supports check mode and diff mode, including the cascade.
        - "``host_info`` filters by ``remark`` or ``address`` and returns every match, which is how to act on all the hosts serving one domain."
        - "``host`` accepts a ``nodes`` option to declare that binding, by node name."
        - "``host`` addresses panels by ``remark`` or, with ``identify_by: address``, by domain, so a list of domains needs no invented remarks; a host created that
          way takes its address as its remark, and ``remark`` becomes an ordinary field that can rename it. An identifier matching several hosts fails the task instead
          of picking one."
        - "``node`` can carry the hosts bound to it along when a node is taken out of service, through ``linked_hosts`` (``ignore``/``enable``/``disable``/``delete``).
          Hosts bound to no node are never affected."
        - "``user``, ``node`` and ``host`` share one ``state`` property: ``present`` (exists, enabled/disabled left alone), ``enabled``, ``disabled`` and ``absent``."
      release_summary: Initial release. Developed and tested against the Remnawave API specification v3.4.3, including a live panel run.
    modules:
      - description: Call an arbitrary Remnawave API endpoint
        name: api
        namespace: ""
