---
argument_specs:
  main:
    short_description: Declaratively manage Remnawave panel entities
    description:
      - Applies the desired state described by the C(remnawave_*) variables to a Remnawave panel, in dependency order (config profiles, squads, nodes, hosts,
        users, subscription settings).
      - Optionally reads entities back afterwards (C(remnawave_gather)) into the C(remnawave_gathered) fact.
      - Every list item accepts the options of the corresponding module of this collection; only C(name)/C(username)/C(remark) is mandatory per item.
      - The whole role can be run with C(--check) (and C(--diff)).
    options:
      remnawave_panel_url:
        type: str
        required: true
        description: Base URL of the Remnawave panel.
      remnawave_token:
        type: str
        required: true
        description: Remnawave API token (bearer).
      remnawave_api_key:
        type: str
        default: ""
        description:
          - X-Api-Key header value for the Caddy security-via-custom-path setup. Empty means the header is not sent.
      remnawave_validate_certs:
        type: bool
        default: true
        description: Whether to validate TLS certificates.
      remnawave_timeout:
        type: int
        default: 30
        description: API request timeout in seconds.
      remnawave_request_headers:
        type: dict
        default: {}
        description: Extra HTTP headers to send with every API request.
      remnawave_snippets:
        type: list
        elements: dict
        default: []
        description:
          - Desired snippets (options of kenyawest.remnawave.snippet).
          - Applied before config profiles, which embed them.
      remnawave_config_profiles:
        type: list
        elements: dict
        default: []
        description: Desired config profiles (options of kenyawest.remnawave.config_profile).
      remnawave_internal_squads:
        type: list
        elements: dict
        default: []
        description: Desired internal squads (options of kenyawest.remnawave.internal_squad).
      remnawave_external_squads:
        type: list
        elements: dict
        default: []
        description: Desired external squads (options of kenyawest.remnawave.external_squad).
      remnawave_nodes:
        type: list
        elements: dict
        default: []
        description: Desired nodes (options of kenyawest.remnawave.node).
      remnawave_hosts:
        type: list
        elements: dict
        default: []
        description: Desired hosts (options of kenyawest.remnawave.host).
      remnawave_users:
        type: list
        elements: dict
        default: []
        description: Desired users (options of kenyawest.remnawave.user).
      remnawave_subscription_settings:
        type: dict
        default: {}
        description:
          - Options of kenyawest.remnawave.subscription_settings. An empty dict means subscription settings are not managed.
      remnawave_gather:
        type: dict
        default: {}
        description:
          - Entity kinds to read back once the desired state is applied, published as the C(remnawave_gathered) fact.
          - A kind is gathered when its key is present. Its value holds the options of the matching info module and may be empty or null to
            read everything.
          - An empty dict gathers nothing, and C(remnawave_gathered) is then not set.
        options:
          snippets:
            type: dict
            description: Options of kenyawest.remnawave.snippet_info (C(name)).
          config_profiles:
            type: dict
            description: Options of kenyawest.remnawave.config_profile_info (C(name)).
          internal_squads:
            type: dict
            description: Options of kenyawest.remnawave.internal_squad_info (C(name)).
          external_squads:
            type: dict
            description: Options of kenyawest.remnawave.external_squad_info (C(name)).
          nodes:
            type: dict
            description: Options of kenyawest.remnawave.node_info (C(name)).
          hosts:
            type: dict
            description: Options of kenyawest.remnawave.host_info (C(remark) or C(address)).
          users:
            type: dict
            description:
              - Options of kenyawest.remnawave.user_info - lookups, stream filters, table filters, sorting and pagination.
          subscription_settings:
            type: dict
            description: Presence reads the subscription settings; the value is ignored.
          system:
            type: dict
            description: Options of kenyawest.remnawave.system_info (C(gather), C(timezone)).
