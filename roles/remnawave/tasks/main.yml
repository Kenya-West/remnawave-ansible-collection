---
- name: Manage Remnawave entities
  module_defaults:
    group/kenyawest.remnawave.remnawave:
      panel_url: "{{ remnawave_panel_url }}"
      token: "{{ remnawave_token }}"
      api_key: "{{ remnawave_api_key | default('', true) or omit }}"
      validate_certs: "{{ remnawave_validate_certs }}"
      timeout: "{{ remnawave_timeout }}"
      request_headers: "{{ remnawave_request_headers }}"
  block:
    # Snippets first: config profiles embed them, so they must exist (and be
    # up to date) before a profile referencing them is written.
    - name: Manage snippets
      kenyawest.remnawave.snippet:
        name: "{{ item.name }}"
        state: "{{ item.state | default('present') }}"
        snippet: "{{ item.snippet | default(omit) }}"
        sync: "{{ item.sync | default(omit) }}"
      loop: "{{ remnawave_snippets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Manage config profiles
      kenyawest.remnawave.config_profile:
        name: "{{ item.name | default(omit) }}"
        inbound: "{{ item.inbound | default(omit) }}"
        state: "{{ item.state | default('present') }}"
        config: "{{ item.config | default(omit) }}"
        tags: "{{ item.tags | default(omit) }}"
      loop: "{{ remnawave_config_profiles }}"
      loop_control:
        label: "{{ item.inbound | default(item.name | default('')) }}"

    - name: Manage internal squads
      kenyawest.remnawave.internal_squad:
        name: "{{ item.name }}"
        state: "{{ item.state | default('present') }}"
        inbounds: "{{ item.inbounds | default(omit) }}"
        tags: "{{ item.tags | default(omit) }}"
      loop: "{{ remnawave_internal_squads }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Manage external squads
      kenyawest.remnawave.external_squad:
        name: "{{ item.name }}"
        state: "{{ item.state | default('present') }}"
        tags: "{{ item.tags | default(omit) }}"
      loop: "{{ remnawave_external_squads }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Manage nodes
      kenyawest.remnawave.node:
        name: "{{ item.name }}"
        state: "{{ item.state | default('present') }}"
        linked_hosts: "{{ item.linked_hosts | default(omit) }}"
        address: "{{ item.address | default(omit) }}"
        port: "{{ item.port | default(omit) }}"
        config_profile: "{{ item.config_profile | default(omit) }}"
        inbounds: "{{ item.inbounds | default(omit) }}"
        traffic_tracking: "{{ item.traffic_tracking | default(omit) }}"
        traffic_limit: "{{ item.traffic_limit | default(omit) }}"
        notify_percent: "{{ item.notify_percent | default(omit) }}"
        traffic_reset_day: "{{ item.traffic_reset_day | default(omit) }}"
        country_code: "{{ item.country_code | default(omit) }}"
        consumption_multiplier: "{{ item.consumption_multiplier | default(omit) }}"
        tags: "{{ item.tags | default(omit) }}"
        note: "{{ item.note | default(omit) }}"
      loop: "{{ remnawave_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    # One task for every host: a loop would be a module run per host, each
    # reading the panel's hosts, nodes and profiles again. Keys the module
    # does not know are dropped, as the loop used to ignore them.
    - name: Manage hosts
      kenyawest.remnawave.hosts:
        hosts: >-
          {{
            remnawave_hosts
            | map('dict2items')
            | map('selectattr', 'key', 'in', __remnawave_host_keys)
            | map('list')
            | map('items2dict')
            | list
          }}
      vars:
        __remnawave_host_keys:
          - identify_by
          - remark
          - state
          - nodes
          - config_profile
          - inbound
          - address
          - port
          - path
          - sni
          - host_header
          - alpn
          - fingerprint
          - security_layer
          - hidden
          - tags
          - server_description
          - vless_route_id
          - override_sni_from_address
          - keep_sni_blank
          - exclude_from_subscription_types
          - internal_squads
      when: remnawave_hosts | length > 0

    - name: Manage users
      kenyawest.remnawave.user:
        username: "{{ item.username }}"
        state: "{{ item.state | default('present') }}"
        expire_at: "{{ item.expire_at | default(omit) }}"
        traffic_limit: "{{ item.traffic_limit | default(omit) }}"
        traffic_limit_strategy: "{{ item.traffic_limit_strategy | default(omit) }}"
        description: "{{ item.description | default(omit) }}"
        tag: "{{ item.tag | default(omit) }}"
        email: "{{ item.email | default(omit) }}"
        telegram_id: "{{ item.telegram_id | default(omit) }}"
        hwid_device_limit: "{{ item.hwid_device_limit | default(omit) }}"
        internal_squads: "{{ item.internal_squads | default(omit) }}"
        external_squad: "{{ item.external_squad | default(omit) }}"
      loop: "{{ remnawave_users }}"
      loop_control:
        label: "{{ item.username }}"

    - name: Manage subscription settings
      kenyawest.remnawave.subscription_settings:
        serve_json_at_base_subscription: "{{ remnawave_subscription_settings.serve_json_at_base_subscription | default(omit) }}"
        show_custom_remarks: "{{ remnawave_subscription_settings.show_custom_remarks | default(omit) }}"
        custom_remarks: "{{ remnawave_subscription_settings.custom_remarks | default(omit) }}"
        custom_response_headers: "{{ remnawave_subscription_settings.custom_response_headers | default(omit) }}"
        randomize_hosts: "{{ remnawave_subscription_settings.randomize_hosts | default(omit) }}"
        response_rules: "{{ remnawave_subscription_settings.response_rules | default(omit) }}"
        hwid_settings: "{{ remnawave_subscription_settings.hwid_settings | default(omit) }}"
      when: remnawave_subscription_settings | length > 0

    # Reads come last, so they show the panel as this run left it.
    - name: Read back entities
      ansible.builtin.import_tasks: gather.yml
